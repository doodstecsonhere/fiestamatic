<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1350" data-bounds="9.235,123.240,9.370,123.350" role="img" aria-labelledby="title desc">
  <title id="title">Offline Dumaguete barangay guide</title>
  <desc id="desc">A geographically aligned schematic of Dumaguete City, its eastern coast, principal roads, and Banica River. Not for street navigation.</desc>
  <metadata>
    Geometry and orientation derived from OpenStreetMap, © OpenStreetMap contributors.
    Projection: x = (longitude - 123.240) × 10000; y = (9.370 - latitude) × 10000.
    Geographic bounds: southwest 9.235,123.240; northeast 9.370,123.350.
  </metadata>
  <defs>
