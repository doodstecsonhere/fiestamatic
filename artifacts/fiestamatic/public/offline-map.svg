      <stop offset="0" stop-color="#fbf6e9"/>
      <stop offset="1" stop-color="#e9ddc4"/>
    </linearGradient>
    <pattern id="local-grid" width="74" height="74" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
